# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'retail_dbt'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'retail_dbt'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# staging/ holds 1:1 cleaned views over the raw sources.
# marts/ holds the dimension and fact tables analysts and Power BI query.
models:
  retail_dbt:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

seeds:
  retail_dbt:
    +schema: raw
    +quote_columns: false
